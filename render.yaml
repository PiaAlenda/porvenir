services:
  - type: web
    name: obreros-api
    runtime: node
    plan: free
    region: southamerica
    buildCommand: pnpm install --frozen-lockfile
    startCommand: npm run serve
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: "production"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SERVE_STATIC
        value: "0"
      # OBLIGATORIA en producción: sin esta variable el servicio no arranca
      # (ver el guard de arranque en server/index.mjs). Tiene que coincidir
      # exactamente con el usuario creado en Supabase Auth, porque es la única
      # allow-list que decide quién entra al panel: cualquier otra cuenta del
      # proyecto queda rechazada aunque la contraseña sea correcta.
      - key: ADMIN_EMAIL
        sync: false
      # Si el panel necesita más de un usuario, listalos separados por coma.
      # Tiene prioridad sobre ADMIN_EMAIL: si lo definís, ADMIN_EMAIL se ignora.
      - key: ADMIN_EMAILS
        sync: false