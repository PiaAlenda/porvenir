            - heading "Finalidad" [level=2] [ref=e540]
          - list [ref=e542]:
            - listitem [ref=e543]: Gestionar tu inscripción, seguimiento académico y administrativo.
            - listitem [ref=e544]: Responder consultas y comunicarnos con vos sobre propuestas formativas.
            - listitem [ref=e545]: Elaborar contratos y constancias vinculados a tu cursada.
            - listitem [ref=e546]: Cumplir obligaciones legales y requerimientos de las autoridades educativas.
        - region [ref=e548]:
