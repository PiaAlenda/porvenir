            - generic [aria-hidden] [ref=e557]: "5"
            - heading "Tus derechos" [level=2] [ref=e558]
          - paragraph [ref=e560]:
            - text: De acuerdo con la Ley N° 25.326 de Protección de los Datos Personales, tenés derecho a acceder, rectificar, actualizar y suprimir tus datos. Para ejercerlos escribinos a
            - link "info@porvenir.edu.ar" [ref=e561] [cursor=pointer]:
              - /url: mailto:info@porvenir.edu.ar
            - text: indicando tu nombre y DNI. La Agencia de Acceso a la Información Pública, como órgano de control de la Ley N° 25.326, tiene la atribución de atender denuncias y reclamos relacionados con el incumplimiento de las normas de protección de datos personales.
        - region [ref=e563]:
