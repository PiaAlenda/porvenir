            - generic [aria-hidden] [ref=e565]: "6"
            - heading "Conservación" [level=2] [ref=e566]
          - paragraph [ref=e568]: Conservamos los datos mientras mantengas una relación académica con la institución y durante los plazos exigidos por la normativa aplicable. Luego serán eliminados o anonimizados.
