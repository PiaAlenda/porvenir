            - heading "Cesión y seguridad de los datos" [level=2] [ref=e551]
          - paragraph [ref=e553]: No vendemos ni cedemos tus datos personales a terceros con fines comerciales. Solo podrán ser compartidos con organismos educativos o autoridades cuando una norma lo exija, o con proveedores tecnológicos que nos asisten en el alojamiento del sitio, bajo deber de confidencialidad. Aplicamos medidas técnicas y organizativas razonables para proteger la información contra accesos no autorizados.
        - region [ref=e555]:
