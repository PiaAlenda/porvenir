          - generic [ref=e529]:
            - paragraph [ref=e530]: "Recopilamos únicamente los datos que nos proporcionás al completar los formularios de inscripción o contacto:"
            - list [ref=e531]:
              - listitem [ref=e532]: "Datos de identificación: nombre y apellido, DNI, CUIL, fecha de nacimiento y nacionalidad."
              - listitem [ref=e533]: "Datos de contacto: correo electrónico, teléfono y domicilio / localidad."
              - listitem [ref=e534]: "Datos académicos: carrera o curso elegido, modalidad y estudios previos."
              - listitem [ref=e535]: Documentación que adjuntes para completar tu inscripción.
